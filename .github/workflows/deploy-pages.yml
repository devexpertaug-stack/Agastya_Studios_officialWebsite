name: Deploy frontend to GitHub Pages

# Builds the React app in frontend/ and publishes it to GitHub Pages.
# The backend (FastAPI) is NOT deployed here — host it on Koyeb/Render and set
# the REACT_APP_BACKEND_URL repository variable to its public URL.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Build
        env:
          CI: "false"
          # Set this repo variable in: Settings -> Secrets and variables -> Actions -> Variables
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
        run: yarn build

      - name: Add SPA fallback (client-side routing) and .nojekyll
        run: |
          cp build/index.html build/404.html
          touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
